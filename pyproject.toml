[project]
name = "office-mcp"
version = "0.1.0"
description = "MCP server controlling Microsoft Word over COM"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pywin32>=306"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
word-mcp = "office_mcp.word.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_mcp"]

[tool.pytest.ini_options]
markers = ["word: needs Microsoft Word"]
testpaths = ["tests"]
# Word teardown logs a harmless "0x800706be" RPC error via faulthandler; silence it
addopts = "-p no:faulthandler"
